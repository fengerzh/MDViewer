[package]
name = "mdviewer"
version = "0.1.0"
description = "极简 Markdown 查看器"
authors = ["zhangjing"]
edition = "2021"

[lib]
name = "mdviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
