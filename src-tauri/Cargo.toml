[package]
name = "mdviewer"
version = "0.2.0"
description = "极简 Markdown 查看器"
authors = ["zhangjing"]
edition = "2021"

[lib]
name = "mdviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
tauri-plugin-dialog = "2"

# 导出 PDF：createPDF（公开 API）+ CoreGraphics 切片，版本与 tauri/wry 依赖树对齐
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSData", "NSError", "NSRunLoop", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKPDFConfiguration", "block2"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFURL"] }
objc2-core-graphics = { version = "0.3", features = ["CGDataProvider", "CGPDFDocument", "CGPDFPage", "CGPDFContext", "CGContext", "CGGeometry"] }
